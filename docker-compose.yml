version: '3.8'

services:
  bot:
    build: .
    container_name: tg-video-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persist downloads (optional, for debugging)
      - ./downloads:/app/downloads
      # Mount cookies.txt if exists (read-only)
      - ./cookies.txt:/app/cookies.txt:ro
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s